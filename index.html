<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabiendev - Bank to Excel</title>
    
    <!-- Styles Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fade-in 0.5s ease-out; }
      .animate-spin-slow { animation: spin 3s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      
      /* Loader initial */
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #f8fafc; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
        transition: opacity 0.5s;
      }
    </style>


    <script>

      window.process = { env: { API_KEY: 'AIzaSyCZ43PpS36pHh5rw9B5tDwx0jlKNHKqswI' } };
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Babel sans modules -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    
    <div id="initial-loader">
        <div class="text-4xl font-bold text-indigo-600 mb-4 animate-bounce">Convertisseur</div>
        <div class="text-slate-500 mb-4">Chargement de l'application...</div>
    </div>

    <div id="root"></div>

 
    <script type="text/babel">
        const { useState, useCallback, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        // --- ICONS SVG ---
        const Icons = {
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Loader2: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            CheckCircle2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/><line x1="10.5" y1="18.5" x2="15.5" y2="13.5"/></svg>
        };

        // --- LOGIC ---
        const fileToBase64 = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64String = reader.result;
                    // On enlève l'en-tête "data:application/pdf;base64,"
                    const base64Data = base64String.split(',')[1];
                    resolve(base64Data);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        // Utilisation de l'API REST Directe pour éviter les problèmes de modules
        const parseBankStatement = async (file, apiKey) => {
            const base64Data = await fileToBase64(file);
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [
                        { text: `Tu es un expert comptable. Analyse ce relevé bancaire PDF.
                            Extrais TOUTES les transactions sous forme de tableau JSON strict.
                            Format: [{ "date": "JJ/MM/AAAA", "libelle": "String", "debit": Number|null, "credit": Number|null }]
                            Ignore les soldes de départ ou de fin, uniquement les mouvements.
                            Si une date n'a pas l'année, utilise l'année du document.` 
                        },
                        { 
                            inline_data: { 
                                mime_type: file.type, 
                                data: base64Data 
                            } 
                        }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: 'ARRAY',
                        items: {
                            type: 'OBJECT',
                            properties: {
                                date: { type: 'STRING' },
                                libelle: { type: 'STRING' },
                                debit: { type: 'NUMBER', nullable: true },
                                credit: { type: 'NUMBER', nullable: true }
                            },
                            required: ["date", "libelle"]
                        }
                    }
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "Erreur lors de l'appel API");
            }

            const data = await response.json();
            
            // Extraction du texte JSON
            if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                const jsonText = data.candidates[0].content.parts[0].text;
                return JSON.parse(jsonText);
            }
            return [];
        };

        const generateExcel = (transactions, fileName) => {
            const worksheetData = transactions.map(t => ({
                'Date': t.date,
                'Libellé': t.libelle,
                'Débit': t.debit,
                'Crédit': t.credit
            }));
            const worksheet = XLSX.utils.json_to_sheet(worksheetData);
            worksheet['!cols'] = [{ wch: 12 }, { wch: 60 }, { wch: 15 }, { wch: 15 }];
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Relevé Consolidé");
            XLSX.writeFile(workbook, fileName);
        };

        // --- COMPONENTS ---
        const App = () => {
            const [files, setFiles] = useState([]);
            const [status, setStatus] = useState('IDLE'); // IDLE, PROCESSING, COMPLETED, ERROR
            const [currentFileIndex, setCurrentFileIndex] = useState(0);
            const [transactions, setTransactions] = useState([]);
            const [error, setError] = useState(null);
            const [apiKey, setApiKey] = useState(process.env.API_KEY || '');

            useEffect(() => {
                const loader = document.getElementById('initial-loader');
                if (loader) loader.style.display = 'none';
            }, []);

            const handleProcess = async () => {
                if (!apiKey) { setError("Clé API manquante"); return; }
                if (files.length === 0) return;

                setStatus('PROCESSING');
                setError(null);
                setTransactions([]);
                const accum = [];

                try {
                    for (let i = 0; i < files.length; i++) {
                        setCurrentFileIndex(i);
                        // Petite pause pour être gentil avec l'API
                        if (i > 0) await new Promise(r => setTimeout(r, 1000)); 
                        
                        try {
                            const res = await parseBankStatement(files[i], apiKey);
                            if (res && Array.isArray(res)) accum.push(...res);
                        } catch (e) {
                            console.error(`Erreur sur le fichier ${files[i].name}:`, e);
                            // On continue quand même avec les autres fichiers
                        }
                    }
                    if (accum.length === 0) throw new Error("Aucune transaction trouvée ou erreur lors de l'analyse.");
                    setTransactions(accum);
                    setStatus('COMPLETED');
                } catch (e) {
                    setError(e.message);
                    setStatus('ERROR');
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 font-bold text-lg">
                                <Icons.FileText /> DIRIGE.IO
                            </div>

                        </div>
                    </header>

                    <main className="flex-grow p-6 max-w-4xl mx-auto w-full">
                        {/* ETAT: PROCESSING */}
                        {status === 'PROCESSING' && (
                            <div className="text-center py-20 animate-fade-in">
                                <Icons.Loader2 className="w-16 h-16 mx-auto text-indigo-500 animate-spin-slow mb-4" />
                                <h2 className="text-2xl font-bold text-slate-700">Analyse en cours...</h2>
                                <p className="text-slate-500">Document {currentFileIndex + 1} / {files.length}</p>
                                <div className="mt-4 w-64 h-2 bg-slate-200 rounded-full mx-auto overflow-hidden">
                                    <div className="h-full bg-indigo-500 transition-all duration-300" 
                                         style={{width: `${((currentFileIndex+1)/files.length)*100}%`}}></div>
                                </div>
                            </div>
                        )}

                        {/* ETAT: IDLE / ERROR */}
                        {(status === 'IDLE' || status === 'ERROR') && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="text-center">
                                    <h1 className="text-3xl font-bold text-slate-800">Convertisseur Bancaire PDF</h1>
                                    <p className="text-slate-500 mt-2">Glissez vos relevés, obtenez un Excel parfait.</p>
                                </div>

                                {status === 'ERROR' && (
                                    <div className="bg-red-50 text-red-700 p-4 rounded-lg flex items-center gap-3 border border-red-200">
                                        <Icons.AlertCircle /> {error}
                                    </div>
                                )}

                                <div className="border-2 border-dashed border-indigo-200 rounded-xl p-10 text-center bg-white hover:bg-indigo-50 transition-colors relative cursor-pointer group">
                                    <input 
                                        type="file" multiple accept=".pdf" 
                                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20"
                                        onChange={(e) => setFiles(Array.from(e.target.files || []))}
                                    />
                                    <div className="mx-auto w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                        <Icons.Upload />
                                    </div>
                                    <p className="font-semibold text-slate-700">Cliquez pour sélectionner vos PDF</p>
                                    <p className="text-sm text-slate-400 mt-1">{files.length > 0 ? `${files.length} fichier(s) sélectionné(s)` : "Janvier, Février, Mars..."}</p>
                                </div>

                                {files.length > 0 && (
                                    <div className="flex justify-center">
                                        <button onClick={handleProcess} className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg font-bold shadow-lg flex items-center gap-2 transition-transform hover:scale-105 active:scale-95">
                                            <Icons.CheckCircle2 /> Convertir {files.length} fichier(s)
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ETAT: COMPLETED */}
                        {status === 'COMPLETED' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-green-50 border border-green-200 p-6 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-4">
                                    <div>
                                        <h3 className="text-xl font-bold text-green-800 flex items-center gap-2"><Icons.CheckCircle2/> Succès !</h3>
                                        <p className="text-green-700">{transactions.length} lignes extraites.</p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => { setStatus('IDLE'); setFiles([]); }} className="text-slate-600 hover:text-slate-900 px-4 py-2">Nouveau</button>
                                        <button onClick={() => generateExcel(transactions, 'Export_BanquePDF.xlsx')} className="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-bold shadow flex items-center gap-2 hover:-translate-y-1 transition-transform">
                                            <Icons.Download /> Télécharger Excel
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="overflow-x-auto border rounded-lg shadow-sm max-h-[500px] overflow-y-auto bg-white">
                                    <table className="w-full text-sm text-left text-slate-600">
                                        <thead className="text-xs text-slate-700 uppercase bg-slate-100 sticky top-0">
                                            <tr>
                                                <th className="px-6 py-3">Date</th>
                                                <th className="px-6 py-3">Libellé</th>
                                                <th className="px-6 py-3 text-right">Débit</th>
                                                <th className="px-6 py-3 text-right">Crédit</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {transactions.map((t, i) => (
                                                <tr key={i} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-3 font-medium whitespace-nowrap">{t.date}</td>
                                                    <td className="px-6 py-3 truncate max-w-xs" title={t.libelle}>{t.libelle}</td>
                                                    <td className="px-6 py-3 text-right text-red-600 font-mono">{t.debit ? t.debit.toFixed(2) : ''}</td>
                                                    <td className="px-6 py-3 text-right text-green-600 font-mono">{t.credit ? t.credit.toFixed(2) : ''}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
