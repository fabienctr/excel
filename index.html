<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convertisseur PDF → Excel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #4f46e5;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body { background: var(--bg); margin: 0; padding: 24px; color: var(--text); }
    .container { max-width: 960px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06); }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p.muted { margin: 0 0 24px; color: var(--muted); }
    .upload { display: flex; gap: 12px; align-items: center; border: 2px dashed var(--border); padding: 16px; border-radius: 12px; background: #f1f5f9; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: transform 120ms ease, box-shadow 120ms ease; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(79, 70, 229, 0.2); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f8fafc; text-transform: uppercase; letter-spacing: 0.04em; font-size: 12px; color: var(--muted); }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; background: #eef2ff; color: #312e81; border-radius: 999px; font-weight: 600; }
    .status { margin-top: 10px; color: var(--muted); font-size: 14px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha512-meG51Dn+9KdX7T3R6eDVlP8DSozsF3enBVALUSqLQuVCC0cksznm/XZP8PKt88kvBAy3MXzCnqYdC0emA4R2ow==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" integrity="sha512-pHRq/d48xCCUG26sFVKx85evbYpzM3DFfnqeCKkiVXLctyrz1X3vH9fqlDK8hNfIpyBAx52lLGlNDss/RZ/QmQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <header style="margin-bottom: 20px; display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
      <div>
        <h1>Relevé bancaire → Excel</h1>
        <p class="muted">Convertit vos PDF en XLSX : Colonne A Date, B Libellé, C Débit, D Crédit.</p>
      </div>
      <div class="pill" aria-label="Étapes">① PDF → texte · ② Analyse · ③ Export XLSX</div>
    </header>

    <div class="card">
      <div class="upload">
        <div style="flex:1">
          <strong>Sélectionnez vos relevés PDF</strong>
          <p class="muted" style="margin-top: 4px">Les fichiers sont traités localement dans votre navigateur.</p>
          <input id="file-input" type="file" accept="application/pdf" multiple style="margin-top: 10px" />
        </div>
        <button id="convert-btn" class="btn" disabled>Convertir en Excel</button>
      </div>
      <div class="status" id="status">Aucun fichier sélectionné.</div>

      <div id="preview"></div>
    </div>
  </div>

  <script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('file-input');
    const convertBtn = document.getElementById('convert-btn');
    const statusEl = document.getElementById('status');
    const previewEl = document.getElementById('preview');

    let selectedFiles = [];

    fileInput.addEventListener('change', (event) => {
      selectedFiles = Array.from(event.target.files || []);
      convertBtn.disabled = selectedFiles.length === 0;
      statusEl.textContent = selectedFiles.length ? `${selectedFiles.length} fichier(s) prêt(s) à être converti(s).` : 'Aucun fichier sélectionné.';
    });

    const parseAmount = (value) => {
      if (!value) return null;
      const normalized = value.replace(/\s+/g, '').replace(',', '.');
      const parsed = Number(normalized);
      return Number.isFinite(parsed) ? parsed : null;
    };

    const parseTransactions = (text) => {
      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const results = [];
      const pattern = /^(\d{1,2}[\/.-]\d{1,2}(?:[\/.-]\d{2,4})?)\s+(.+?)\s+(-?\d+[.,]\d{2})(?:\s+(-?\d+[.,]\d{2}))?$/;

      for (const line of lines) {
        const match = line.match(pattern);
        if (!match) continue;

        const [, date, label, amountA, amountB] = match;
        let debit = null;
        let credit = null;

        if (amountB) {
          debit = parseAmount(amountA);
          credit = parseAmount(amountB);
        } else {
          const value = parseAmount(amountA);
          if (value < 0) {
            debit = Math.abs(value);
          } else {
            credit = value;
          }
        }

        results.push({ date, libelle: label, debit, credit });
      }

      return results;
    };

    const readPdfText = async (file) => {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = '';
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        const strings = content.items.map((item) => item.str).join(' ');
        text += `\n${strings}\n`;
      }
      return text;
    };

    const buildSheet = (transactions) => {
      const header = [['Date', 'Libellé', 'Débit', 'Crédit']];
      const rows = transactions.map((t) => [t.date, t.libelle, t.debit ?? '', t.credit ?? '']);
      return XLSX.utils.aoa_to_sheet([...header, ...rows]);
    };

    const renderPreview = (transactions) => {
      if (!transactions.length) {
        previewEl.innerHTML = '<p class="muted">Aucune ligne détectée pour le moment.</p>';
        return;
      }

      const rows = transactions.slice(0, 50).map((t) => `
        <tr>
          <td>${t.date}</td>
          <td>${t.libelle}</td>
          <td class="amount">${t.debit !== null && t.debit !== undefined ? t.debit.toFixed(2) : ''}</td>
          <td class="amount">${t.credit !== null && t.credit !== undefined ? t.credit.toFixed(2) : ''}</td>
        </tr>
      `).join('');

      previewEl.innerHTML = `
        <table aria-label="Aperçu des transactions">
          <thead>
            <tr><th>Date</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <p class="muted">${transactions.length} ligne(s) détectée(s). Exportez pour obtenir toutes les données.</p>
      `;
    };

    const convertFiles = async () => {
      if (!selectedFiles.length) return;
      convertBtn.disabled = true;
      statusEl.textContent = 'Extraction en cours...';
      previewEl.innerHTML = '';

      const allTransactions = [];

      for (const file of selectedFiles) {
        statusEl.textContent = `Analyse de "${file.name}"...`;
        const text = await readPdfText(file);
        const transactions = parseTransactions(text);
        allTransactions.push(...transactions);
      }

      if (!allTransactions.length) {
        statusEl.textContent = 'Aucune transaction reconnue. Vérifiez le format de vos relevés.';
        convertBtn.disabled = false;
        renderPreview([]);
        return;
      }

      statusEl.textContent = `${allTransactions.length} transaction(s) prêtes. Génération du fichier...`;

      const worksheet = buildSheet(allTransactions);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Releve');
      XLSX.writeFile(workbook, 'releve_bancaire.xlsx');

      renderPreview(allTransactions);
      statusEl.textContent = 'Conversion terminée ! Vous pouvez relancer une conversion en sélectionnant de nouveaux PDF.';
      convertBtn.disabled = false;
    };

    convertBtn.addEventListener('click', () => {
      convertFiles().catch((error) => {
        console.error(error);
        statusEl.textContent = "Une erreur est survenue lors de l'analyse du PDF.";
        convertBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
